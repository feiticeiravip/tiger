            const schedules = bancas[banca].schedules[today] || [];

            });
        }
        function handlePuxada() {
            const select = document.getElementById('animalSelect');
            const btn = document.getElementById('verPuxada');
            const result = document.getElementById('puxadaResult');
            if (!select || !btn || !result) return;
            select.addEventListener('change', () => {
                btn.classList.toggle('hidden', !select.value);
                result.innerHTML = '';
            });
            btn.addEventListener('click', () => {
                const animal = select.value;
                if (!animal) return;
                const pulls = puxadas[animal] || [];
                result.innerHTML = `
                    <h3>Puxadas para ${animal}</h3>
                    <ul class="list-disc pl-5 mt-2">
                        ${pulls.length ? pulls.map(p => `<li>${animals.find(a=>a.name===p)?.emoji || ''} ${p}</li>`).join('') : '<li>Sem puxadas cadastradas</li>'}
                    </ul>
                `;
            });
        }
        // ==================== EVENTOS ====================
        document.addEventListener('DOMContentLoaded', () => {
            const bancaSelect = document.getElementById('bancaSelect');
            const gerarBtn = document.getElementById('gerarPalpites');
            if (bancaSelect && gerarBtn) {
                bancaSelect.addEventListener('change', () => {
                    document.getElementById('palpiteOutput').innerHTML = '';
                    gerarBtn.disabled = !bancaSelect.value;
                });
                gerarBtn.addEventListener('click', displayPalpites);
            }
            // Botão flutuante afiliados
            const fab = document.getElementById('afiliados-fab');
            const modal = document.getElementById('afiliados-modal');
            const close = document.getElementById('modal-close');
            const afiliar = document.getElementById('btn-afiliar');
            if (fab) fab.addEventListener('click', () => modal.classList.add('show'));
            if (close) close.addEventListener('click', () => modal.classList.remove('show'));
            if (modal) modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('show'); });
            if (afiliar) afiliar.addEventListener('click', () => {
                window.open('https://wa.me/5583993370071?text=Quero%20me%20tornar%20promotor%20e%20ganhar%20dinheiro%20com%20indica%C3%A7%C3%B5es!', '_blank');
                modal.classList.remove('show');
            });
            mostrar('jogar');
        });
